<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="text-scale" content="scale">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IS Team">
<title>Igor Sousa Team</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app"><div class="splash"><div style="display:flex;flex-direction:column;align-items:center;gap:18px"><div class="logo big">IGOR<br>SOUSA <b>TEAM</b></div><p id="lento" class="muted" style="text-align:center;max-width:260px;visibility:hidden"></p></div></div></div>
<script>/* internet lenta na 1ª abertura: avisa em vez de deixar o logo parado */
function semSinal(){var e=document.getElementById('lento');if(!e)return;var l=(navigator.language||'pt').slice(0,2);e.innerHTML=(l==='es'?'Sin internet y la app aún no quedó guardada en el celular. Ábrela una vez con señal.':l==='en'?'No internet and the app isn’t saved on this phone yet. Open it once with signal.':l==='fr'?'Pas d’internet et l’app n’est pas encore enregistrée. Ouvre-la une fois avec du réseau.':'Sem internet e o app ainda não ficou guardado no celular. Abre uma vez com sinal.')+'<br><button onclick="location.reload()" style="margin-top:14px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:#ff6a00;color:#1a0d00;font-weight:700">'+(l==='es'?'Intentar de nuevo':l==='en'?'Try again':l==='fr'?'Réessayer':'Tentar de novo')+'</button>';e.style.visibility='visible';}
setTimeout(function(){if(document.getElementById('lento')&&navigator.onLine===false)semSinal();},12000);
setTimeout(function(){var e=document.getElementById('lento');if(!e)return;if(navigator.onLine===false){e.textContent=(navigator.language||'pt').slice(0,2)==='en'?'No signal… opening what is saved.':'Sem sinal… abrindo o que tá guardado no celular.';e.style.visibility='visible';return;}var l=(navigator.language||'pt').slice(0,2),j=0;try{j=!!localStorage.getItem('perfil')}catch(x){}e.textContent=j?(l==='es'?'Internet lenta… ya casi abre.':l==='en'?'Slow connection… almost there.':l==='fr'?'Connexion lente… presque prêt.':'Internet lenta… já já abre.'):(l==='es'?'Cargando… internet lenta. Solo tarda así la primera vez.':l==='en'?'Loading… slow connection. It only takes this long the first time.':l==='fr'?'Chargement… connexion lente. C’est long seulement la première fois.':'Carregando… internet lenta. Só demora assim na 1ª vez.');e.style.visibility='visible';},3000);</script>
<div id="overlay"></div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script>
<script type="module" src="js/app.js" onerror="semSinal()"></script>
</body>
</html>
