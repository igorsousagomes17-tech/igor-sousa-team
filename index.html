<script>/* internet lenta na 1ª abertura: avisa em vez de deixar o logo parado */
setTimeout(function(){var e=document.getElementById('lento');if(!e)return;var l=(navigator.language||'pt').slice(0,2);e.textContent=l==='es'?'Cargando… internet lenta. Solo tarda así la primera vez.':l==='en'?'Loading… slow connection. It only takes this long the first time.':l==='fr'?'Chargement… connexion lente. C’est long seulement la première fois.':'Carregando… internet lenta. Só demora assim na 1ª vez.';e.style.visibility='visible';},4000);</script>
